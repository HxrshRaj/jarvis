name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q
      - name: Deterministic evaluation suite runs
        run: python -m app.services.evals > /dev/null
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  e2e:
    # Builds the real docker stack (Postgres + migrations) and runs Playwright against it.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Start stack with throwaway CI-only secrets
        run: |
          echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)" >> .env
          echo "JARVIS_SECRET_KEY=ci-$(openssl rand -hex 16)" >> .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fs localhost:8000/health && break; sleep 2; done
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - if: failure()
        run: docker compose logs --tail=200
