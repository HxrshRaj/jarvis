[project]
name = "jarvis-backend"
version = "0.2.0"
description = "JARVIS backend: task engine, tool registry, policy, RAG, memory, LLM provider interface"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
  "langgraph>=0.2",
  "pandas>=2.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.3",
]

[project.optional-dependencies]
# PyTorch is only needed to train/run the optional torch router. CPU wheels:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
ml = ["torch>=2.2"]
dev = ["pytest>=8", "torch>=2.2"]

[tool.setuptools.packages.find]
include = ["app*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
